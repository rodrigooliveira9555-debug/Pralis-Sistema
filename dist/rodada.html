<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Cotação · CICLUZ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="ui-foundation.css?v=54ec30fe6fe9">
<link rel="stylesheet" href="compras/compras.css?v=80023ff00056">
<style>
  :root { --menu-accent: #22c55e; --panel-text: #12672e; --layout-line: #dedee3; --theme-card: #fff; --muted: #73737a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #f5f5f7; color: #3f3f46; font: 14px/20px Montserrat, system-ui, sans-serif; }
  .rodada-topo { background: var(--menu-accent); color: #fff; padding: 16px max(16px, env(safe-area-inset-left)); }
  .rodada-topo h1 { margin: 0; font: 600 16px/20px Montserrat, sans-serif; }
  .rodada-topo p { margin: 2px 0 0; font-size: 11px; line-height: 14px; }
  main { max-width: 860px; margin: 0 auto; padding: 16px; display: grid; gap: 12px; }
  .rodada-item { display: grid; gap: 10px; }
  .rodada-item-cab { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: baseline; }
  .rodada-campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
  .rodada-campos input, .rodada-campos select, .rodada-cond input, .rodada-cond select, .rodada-cond textarea {
    width: 100%; min-height: 42px; border: 1px solid #d4d4d8; border-radius: 8px; padding: 10px 12px; font: 400 16px/20px Montserrat, sans-serif; background: #fff; color: inherit;
  }
  .rodada-cond { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
  .rodada-total { font-weight: 600; }
  .rodada-acoes { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; position: sticky; bottom: 0; background: #f5f5f7; padding: 10px 0 max(10px, env(safe-area-inset-bottom)); }
  .btn { font: 600 13px/18px Montserrat, sans-serif; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--menu-accent); background: var(--menu-accent); color: #fff; cursor: pointer; }
  .btn.secondary { background: transparent; color: var(--panel-text); }
  .rodada-banner { border: 1px solid #93c5fd; background: #eff6ff; border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; }
  .rodada-erro { color: #b91c1c; margin: 0; }
  .rodada-aviso-demo { font-size: 11px; color: var(--muted); text-align: center; }
  label { display: grid; gap: 6px; font-size: 12px; }
  [hidden] { display: none !important; }
  .rodada-item-cab small { color: var(--muted); }
  .rodada-separacao input, .rodada-vendo input[type=search] { width: 100%; min-height: 42px; border: 1px solid #d4d4d8; border-radius: 8px; padding: 10px 12px; font: 400 16px/20px Montserrat, sans-serif; }
  .rodada-separacao .rodada-item-cab { padding: 8px 0; border-top: 1px solid var(--layout-line); align-items: center; }
  .rodada-separacao .rodada-item-cab label { min-width: 160px; flex: 0 1 220px; }
  .rodada-acoes-inline { position: static; background: none; padding: 0; justify-content: space-between; align-items: center; }
  .rodada-vendo-lista { display: grid; gap: 2px; max-height: 320px; overflow: auto; border: 1px solid var(--layout-line); border-radius: 8px; padding: 6px 10px; background: #fff; }
  .rodada-vendo-item { display: flex; align-items: center; gap: 10px; font-size: 13px; padding: 6px 0; }
  .rodada-vendo-item input { width: 20px; height: 20px; accent-color: var(--menu-accent); flex: 0 0 20px; }
  .rodada-vendo .btn { justify-self: start; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
<header class="rodada-topo"><h1 id="titulo">Cotação</h1><p id="subtitulo"></p></header>
<main id="app"></main>
<script src="compras/dominio.js?v=fbc52d83f236"></script>
<script src="compras/produto-regras.js?v=35dad8df084b"></script>
<script src="compras/produto-fiscal.js?v=e5dd14ecf046"></script>
<script src="compras/dados.js?v=1f6d05c4a3c2"></script>
<script src="compras/servico.js?v=4a837cdc445d"></script>
<script src="compras/fornecedor.js?v=36b78aab6671"></script>
</body>
</html>
