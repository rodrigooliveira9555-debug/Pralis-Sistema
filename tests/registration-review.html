<!doctype html><meta charset="utf-8"><title>Revisão de cadastros</title><style>body{margin:0;background:#ddd;font:14px system-ui;display:flex;gap:16px}iframe{border:0;flex:none;width:390px;height:844px}aside{max-width:600px;padding:10px}button{margin:3px}pre{white-space:pre-wrap;font-size:12px}</style><iframe id="mobile" src="/"></iframe><aside><button onclick="go('cadastro-completo')">Completo</button><button onclick="go('cadastro-simples')">Simples</button><button onclick="go('job-edit')">Cargo</button><button onclick="go('asset-view')">Patrimônio</button><button onclick="people()">Pessoas</button><button onclick="mobile.style.width='320px'">320</button><button onclick="mobile.style.width='390px'">390</button><button onclick="mobile.style.width='1024px'">1024</button><button onclick="measure()">Medir</button><button onclick="allScreens()">Conferir estruturas</button><button onclick="sweep()">Conferir calendários e bordas</button><button onclick="financial()">Conferir financeiros</button><button onclick="localDialog()">Diálogo Área</button><pre id="report"></pre></aside><script>
const w=()=>mobile.contentWindow,d=()=>mobile.contentDocument;
function go(id){w().route(id);if(d().body.classList.contains('mobile-menu-visible'))d().getElementById('toggleMenu').click();}
function people(){if(d().body.classList.contains('mobile-menu-visible'))d().getElementById('toggleMenu').click();w().openSection('Cadastros','Gestão de Pessoas','people-settings','#7c3aed')}
function rect(e){const r=e.getBoundingClientRect();return {x:r.x,y:r.y,w:r.width,h:r.height,right:r.right,bottom:r.bottom}}
function data(){const v=d().querySelector('.view.show'),h=v.querySelector('.head'),c=v.querySelector('.content'),f=v.querySelector('footer'),date=f?.querySelector('.people-date-panel');return {view:v.id,head:rect(h),content:rect(c),footer:f&&rect(f),panelGap:w().getComputedStyle(v.querySelector('.panel')).gap,calendar:date&&!date.hidden?{...rect(date),rightGap:rect(f).right-rect(date).right,bottomGap:rect(f).y-rect(date).bottom}:null,availableCalendar:f?.querySelector('[data-control-key="date"]')?.hidden,steps:[...v.querySelectorAll('[data-step]')].map(e=>({button:rect(e),circle:rect(e.querySelector('.step-circle')),label:rect(e.querySelector('.step-label'))})),overflow:c.scrollWidth>c.clientWidth}}
function measure(){report.textContent=JSON.stringify(data(),null,2)}
async function allScreens(){const rows=[];for(const v of [...d().querySelectorAll('.view')]){if(v.id==='sector-view'){people()}else go(v.id);await new Promise(r=>setTimeout(r,90));const f=v.querySelector('footer'),date=f?.querySelector('[data-control-key="date"]');rows.push({id:v.id,footers:v.querySelectorAll('footer').length,gap:w().getComputedStyle(v.querySelector('.panel')).rowGap,date:!!date&&!date.hidden,overflow:v.querySelector('.content').scrollWidth>v.querySelector('.content').clientWidth})}report.textContent=JSON.stringify(rows,null,2)}

const settled=()=>new Promise(r=>w().requestAnimationFrame(()=>setTimeout(r,120)));
async function inspect(label){await settled();const v=d().querySelector('dialog[open]')||d().querySelector('.view.show'),p=v.querySelector(':scope>.panel'),h=p.querySelector(':scope>.head'),c=p.querySelector(':scope>.content'),f=p.querySelector('footer'),button=f.querySelector('[data-control-key="date"]');
let visible=button&&!button.hidden;if(!visible)return {label,error:'calendário ausente'};
button.click();await settled();let panel=f.querySelector('.people-date-panel');let r=rect(panel),fr=rect(f);const expected=parseFloat(w().getComputedStyle(f).getPropertyValue('--footer-inset'));
const top=rect(h).y;c.scrollTop=c.scrollHeight;await settled();const hr=rect(h),protectedNode=d().elementFromPoint(hr.x+hr.w/2,hr.y+20);
const out={label,date:!panel.hidden,rightGap:fr.right-r.right,bottomGap:fr.y-r.bottom,expected,headerStable:Math.abs(hr.y-top)<1,headerProtected:h.contains(protectedNode),gap:w().getComputedStyle(p).rowGap,overflow:c.scrollWidth>c.clientWidth};
panel.querySelector('.people-date-close').click();c.scrollTop=0;
f.querySelector('.people-header-toggle').click();await settled();button.click();await settled();r=rect(panel);fr=rect(f);out.hiddenHeadGaps=[fr.right-r.right,fr.y-r.bottom];panel.querySelector('.people-date-clear').click();panel.querySelector('.people-date-close').click();f.querySelector('.people-header-toggle').click();return out}
async function sweep(){const results=[];for(const width of [390]){mobile.style.width=width+'px';await settled();for(const v of [...d().querySelectorAll('.view')]){if(v.id==='sector-view')people();else go(v.id);results.push({width,...await inspect(v.id)});report.textContent=JSON.stringify(results,null,2)}}report.textContent=JSON.stringify(results,null,2)}
async function financial(){const results=[];mobile.style.width='390px';for(const key of ['despesas','mercadorias','retiradas','vendas','contas','tipos-venda','bandeiras','operadoras']){if(d().body.classList.contains('mobile-menu-visible'))d().getElementById('toggleMenu').click();people();w().showTiGroup(key,key,'');await new Promise(r=>setTimeout(r,500));const add=d().querySelector('#sector-view .head .header-add-circle');if(add)add.click();await new Promise(r=>setTimeout(r,500));const v=d().getElementById('sector-view'),p=v.querySelector('.panel'),h=p.querySelector('.head'),c=p.querySelector('.content'),f=p.querySelector('footer');results.push({key,title:h.querySelector('h2').textContent,editor:!!c.querySelector('form.account-editor'),gap:w().getComputedStyle(p).rowGap,overlap:rect(h).bottom-rect(c).y,footer:rect(f),calendar:!f.querySelector('[data-control-key="date"]').hidden,overflow:c.scrollWidth>c.clientWidth});report.textContent=JSON.stringify(results,null,2)}}
function localDialog(){people();setTimeout(()=>{const cards=[...d().querySelectorAll('#sector-content .record')];cards.find(c=>c.textContent.includes('Área / Setor / Local'))?.click();setTimeout(()=>d().querySelector('.head .header-add-circle')?.click(),200)},100)}
</script>
